name = "zhanno-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
AI_PROVIDER = "minimax"
AI_MODEL = "abab6.5s-chat"
# 被滥用需停用的授权码，逗号分隔，改完要重新 deploy
BLOCKED_CODES = ""

# 以下三项是 Secret，不写在这个文件里，用命令单独设置：
#   npx wrangler secret put LICENSE_SECRET     授权码签名密钥
#   npx wrangler secret put AI_API_KEY         你的 MiniMax Key
#   npx wrangler secret put MINIMAX_GROUP_ID   你的 MiniMax GroupId
